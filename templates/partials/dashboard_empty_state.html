<div class="dashboard-empty-state">
    <p class="dashboard-empty-state-title">{{ title }}</p>
    {% if description %}
    <p class="dashboard-empty-state-description">{{ description }}</p>
    {% endif %}
    {% if action_url and action_label %}
    <a class="dashboard-btn-secondary" href="{{ action_url }}">{{ action_label }}</a>
    {% endif %}
</div>
