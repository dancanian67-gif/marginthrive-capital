<a
    class="dashboard-glass dashboard-card dashboard-kpi-card dashboard-kpi-card-link"
    href="{{ href }}"
    aria-label="{{ label }}: {{ value }}. View matching applications."
>
    <p class="dashboard-kpi-label">{{ label }}</p>
    <p class="dashboard-kpi-value">{{ value }}</p>
    <span class="dashboard-kpi-drilldown">View applications →</span>
</a>
