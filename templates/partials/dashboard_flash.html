{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="dashboard-flash-stack" role="status" aria-live="polite">
    {% for category, message in messages %}
    <div class="dashboard-flash dashboard-flash-{{ category }}" role="alert">
        <span class="dashboard-flash-icon" aria-hidden="true"></span>
        <span class="dashboard-flash-message">{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
